# ─── DAY 7 NEW FILE: config-server/application.properties ───

server.port=8888

# Service name
spring.application.name=CONFIG-SERVER

# ─── DAY 7 NEW: Point to your local config repo ───
# Change this path to where YOUR config-repo folder is!
spring.cloud.config.server.git.uri=file:///C:/config-repo

# Allow reading from local folder
spring.cloud.config.server.git.default-label=master

# ─── DAY 7 NEW: Register with Eureka ───
# Config server also registers so services can find it
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Logging
logging.level.org.springframework.cloud.config=INFO