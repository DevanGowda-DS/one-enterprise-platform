server.port=8080

spring.application.name=gateway-service

# Day 3: /api/users/** -> User Service
# Day 6: uri changed from a hard-coded http://localhost:8081 to
# lb://USER-SERVICE. The "lb://" scheme tells Spring Cloud Gateway
# to resolve USER-SERVICE against the Eureka registry (see
# eureka.client.service-url.defaultZone below) instead of using a
# fixed address, so it keeps working even if the instance moves
# or there are multiple instances.
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# Day 3: /api/orders/** -> Order Service (strips the /api prefix)
# Day 6: uri changed from a hard-coded http://localhost:8082 to
# lb://ORDER-SERVICE, resolved via Eureka the same way as above.
spring.cloud.gateway.routes[1].id=order-service-route
spring.cloud.gateway.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# ---------------------------------------------------------------------
# Day 6: register the gateway itself with Eureka and point it at the
# Discovery Server so lb:// route URIs above can be resolved to a real,
# currently-registered service instance.
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

logging.level.org.springframework.cloud.gateway=INFO