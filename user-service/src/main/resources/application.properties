spring.application.name=user-service
server.port=8081

# Actuator-style basic logging so it's easy to see requests during learning exercises
logging.level.com.oneenterprise.userservice=INFO

# ---------------------------------------------------------------------
# Day 6: Eureka client registration.
# On startup this service registers itself with the Discovery Server
# under the name USER-SERVICE (from spring.application.name above).
# The Gateway and other services then look it up by that name instead
# of a fixed host/port.
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
