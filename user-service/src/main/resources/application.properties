# ─── DAY 7 CHANGES in user-service/application.properties ───

server.port=8081
spring.application.name=user-service

# ─── DAY 7 NEW: Active profile (dev/test/prod) ───
# This tells Config Server which profile file to load
# user-service-dev.properties will be loaded
spring.profiles.active=dev

# ─── DAY 7 NEW: Connect to Config Server ───
# Service reads config from Config Server at startup
# optional: means app still starts if Config Server is down
spring.config.import=optional:configserver:http://localhost:8888

# Eureka (same as before)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.lease-renewal-interval-in-seconds=5

# ─── DAY 7 NOTE: These values below can now be removed
# because they are in Config Server's user-service.properties
# Keeping them here as FALLBACK if Config Server is down ───
user.service.connect-timeout-ms=2000
user.service.read-timeout-ms=5000

# Logging
logging.level.com.oneenterprise.userservice=DEBUG