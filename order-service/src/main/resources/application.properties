spring.application.name=order-service
server.port=8082

# Day 2/3: User Service location is configuration, not hard-coded Java.
# Point this at a different host/port (e.g. staging) without touching any Java code.
user.service.base-url=http://localhost:8081
user.service.connect-timeout-ms=2000
user.service.read-timeout-ms=2000

------------------------------------------------------------------

# Retry: a small, limited number of attempts for transient failures only.
resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=300ms
resilience4j.retry.instances.userService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.RestClientException

# Circuit breaker: Closed -> Open -> Half-open, protects User Service from repeated hammering
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userService.automatic-transition-from-open-to-half-open-enabled=true

# Expose actuator endpoints so you can watch circuit breaker state change during the
# Day 4 hands-on challenge: GET http://localhost:8082/actuator/circuitbreakers
management.endpoints.web.exposure.include=health,circuitbreakers,retries
management.endpoint.health.show-details=always

logging.level.com.oneenterprise.orderservice=INFO
logging.level.io.github.resilience4j=DEBUG
