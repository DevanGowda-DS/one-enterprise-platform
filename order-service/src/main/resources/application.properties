# ─── DAY 7 CHANGES in order-service/application.properties ───

server.port=8082
spring.application.name=order-service

# ─── DAY 7 NEW: Active profile ───
spring.profiles.active=dev

# ─── DAY 7 NEW: Connect to Config Server ───
spring.config.import=optional:configserver:http://localhost:8888

# Eureka (same as before)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.lease-renewal-interval-in-seconds=5

# ─── DAY 7 NOTE: user.service.base-url is now in Config Server
# Keeping here as fallback only ───
user.service.base-url=http://localhost:8081
user.service.connect-timeout-ms=2000
user.service.read-timeout-ms=2000

# Resilience4j (same as before)
resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=500ms
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10

# Logging
logging.level.com.oneenterprise.orderservice=DEBUG